<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Josh's Hub</title>
  <!-- The old Hub was retired on Nov 26, 2026. This address now just opens the new Hub. -->
  <meta http-equiv="refresh" content="0; url=v2/">
  <link rel="canonical" href="v2/">
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font: 16px -apple-system, system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; background: #000; color: #fff; }
    a { color: inherit; }
  </style>
</head>
<body>
  <p>The Hub has moved. <a href="v2/">Open the new Hub</a>.</p>
  <script>
    // Take the old app's offline helper off this phone, then go to the new Hub.
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => { if (!r.scope.includes('/v2/')) r.unregister(); })).catch(() => {});
    }
    location.replace('v2/');
  </script>
</body>
</html>
