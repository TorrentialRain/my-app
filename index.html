<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>My App</title>
  <meta name="theme-color" content="#0b0b0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="My App">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <style>[hidden]{display:none!important}</style>
  <link rel="stylesheet" href="styles.css?v=8">
</head>
<body>
  <!-- Sign-on screen. Covers the whole app until the right username + password are entered. -->
  <div id="lock" class="lock">
    <form id="lock-form" class="lock-card" autocomplete="on">
      <img src="icons/icon-180.png" alt="" class="lock-icon">
      <h1 id="lock-title">Sign in</h1>
      <p id="lock-hint" class="lock-hint"></p>
      <input id="lock-user" name="username" type="text" placeholder="Username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      <input id="lock-pass" name="password" type="password" placeholder="Password" autocomplete="current-password" required>
      <input id="lock-pass2" name="password2" type="password" placeholder="Password again" autocomplete="new-password" hidden>
      <p id="lock-error" class="lock-error" role="alert"></p>
      <button id="lock-go" type="submit">Sign in</button>
    </form>
  </div>

  <div id="app" hidden>
    <!-- The Hub fills the whole screen. Its pages are loaded from the private data box, not from this repo. -->
    <iframe id="hub-frame" title="Hub" hidden></iframe>

    <!-- Shown instead of the Hub while it loads, or if it can't be loaded. -->
    <div id="hub-wait" class="hub-wait">
      <p id="hub-msg">Loading…</p>
    </div>

    <!-- Small round button, bottom right, that opens Settings. -->
    <button type="button" id="gear" aria-label="Settings" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.5"/><circle cx="8" cy="17" r="2.5"/></svg>
    </button>

    <!-- Settings, full screen over the Hub. -->
    <div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-label="Settings" hidden>
      <header class="sheet-top">
        <h1>Settings</h1>
        <button type="button" id="sheet-close" aria-label="Close settings">Done</button>
      </header>
      <div class="sheet-body">
        <div class="card" id="box-card">
          <h2>Data box</h2>
          <p id="box-status">Checking…</p>
          <form id="box-form" class="box-form" hidden>
            <input id="box-key" type="password" placeholder="Paste your data box key" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">
            <button type="submit" id="box-connect">Connect</button>
          </form>
          <p id="box-error" class="lock-error" role="alert"></p>
          <p id="sync-status" class="footnote left"></p>
        </div>
        <div class="list">
          <div class="row" id="backup-now" role="button"><span>Back up now</span><span class="chev">›</span></div>
          <label class="row" id="import-row"><span>Import a backup or Hub export</span><span class="chev">›</span><input id="import-file" type="file" accept="application/json,.json" hidden></label>
          <div class="row" id="box-forget" role="button"><span>Disconnect data box</span><span class="chev">›</span></div>
          <div class="row" id="lock-now" role="button"><span>Lock app</span><span class="chev">›</span></div>
        </div>
        <p id="import-status" class="footnote"></p>
        <p class="footnote">My App · shell v8</p>
      </div>
    </div>
  </div>
  <script src="vault.js?v=8"></script>
  <script src="store.js?v=8"></script>
  <script src="hubdb.js?v=8"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
